  - type: Features
    data:
      - Maestro — unified molecular modeling and visualization environment for life sciences and (as MS Maestro) materials science
      - LiveDesign — cloud-native enterprise design lab with a snap-in API framework for integrating in-house and third-party tooling
      - Physics-based drug discovery stack — Glide docking, FEP+ free energy perturbation, Desmond molecular dynamics, Jaguar quantum chemistry, Prime protein structure prediction, BioLuminate biologics
      - Materials science stack — MS Maestro, MS Desmond, MS Jaguar, MS LiveDesign, MS Surface (catalysis), MS Morph (organic crystal habit)
      - Schrödinger Python API (release 2026-1) — programmatic structure I/O, Maestro automation, jobcontrol, Glide / FEP+ / Desmond / Jaguar / Prime / MacroModel / BioLuminate drivers, and LiveDesign export / login / dataset modules
      - Predictive toxicology initiative and AI-powered conversational interface inside Maestro (2026 strategic priorities)
      - KNIME extensions exposing Schrödinger nodes for workflow authors
      - PyMOL — Schrödinger-maintained open-source molecular visualization system used across the industry
      - Open-source cheminformatics building blocks — maeparser, coordgenlibs, sketcher, gpusimilarity (CUDA), csmiles
      - Online certification courses and a free learning portal for the platform
      - Drug discovery pipeline — proprietary and partnered programs including SGR-1505 (MALT1 inhibitor) and collaborations such as Lilly TuneLab integration into LiveDesign
      - Two-segment business — software licensing to global pharma, biotech, and materials companies plus a co-developed and proprietary drug discovery portfolio
      - Public company listed on NASDAQ under the ticker SDGR
      - Access is gated through commercial licensing and the my.schrodinger.com customer portal; no self-serve public REST API and no public developer signup
