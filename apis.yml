aid: schrodinger
name: Schrödinger
description: >-
  Schrödinger is a New York-headquartered (NASDAQ: SDGR) computational science
  company that develops a physics-based and AI-driven molecular simulation
  platform used across drug discovery and materials science. Its flagship
  desktop modeling environment is Maestro (MS Maestro for materials science),
  which integrates a deep stack of computational tools — Glide (docking),
  FEP+ (free energy perturbation), Desmond (molecular dynamics), Jaguar
  (quantum chemistry), Prime (protein structure prediction), BioLuminate
  (biologics), LigPrep, QikProp, SiteMap, and WaterMap — together with the
  Schrödinger-maintained PyMOL visualization system. LiveDesign is the
  cloud-native enterprise design lab where chemists, biologists, and program
  teams collaborate on molecules, run computational workflows, and integrate
  experimental data; it exposes a snap-in API framework for connecting
  in-house and third-party tooling. The Schrödinger Python API (current
  release 2026-1) is the primary developer surface, providing programmatic
  access to molecular structures, Maestro automation, jobcontrol, Glide,
  FEP+, Desmond, Jaguar, MacroModel, Prime, BioLuminate, and LiveDesign
  integration (login, export, dataset and column management). Schrödinger
  also ships KNIME extensions, command-line drivers for every computational
  product, and maintains a meaningful open-source footprint on GitHub —
  including PyMOL, maeparser, coordgenlibs, sketcher, gpusimilarity, csmiles,
  and the fixed-data-table-2 React component. The business has two segments —
  software licensing to global pharma, biotech, and materials companies, and
  a co-developed and proprietary drug discovery pipeline. There is no public
  developer signup or self-serve REST API; access to the platform, Python
  API, and LiveDesign is gated through commercial licensing and the
  my.schrodinger.com customer portal.
